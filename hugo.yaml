baseURL: https://nwb.org/
languageCode: en
title: Neurodata Without Borders

# Site Parameters
params:
  # Used in search results and link previews for pages that have no
  # description or image of their own.
  description: Neurodata Without Borders (NWB) is a data standard and software ecosystem for neurophysiology and behavioral data.
  shareImage: /images/share-card.jpg

# Build Settings
buildFuture: true

# Pagination
pagination:
  pagerSize: 10

# Markup
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github
    lineNos: false
    noClasses: false

# Modules
module:
  mounts:
    - source: assets
      target: assets
