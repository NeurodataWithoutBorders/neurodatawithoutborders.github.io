baseURL: https://nwb.org/
languageCode: en
title: Neurodata Without Borders

# Build Settings
buildFuture: true

# Pagination
pagination:
  pagerSize: 10

# The site does not use taxonomies. Without this, Hugo builds unstyled
# /tags/ and /categories/ pages that nothing links to and adds them to the
# sitemap.
disableKinds:
  - taxonomy
  - term

# Markup
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github
    lineNos: false
    noClasses: false

# Modules
module:
  mounts:
    - source: assets
      target: assets
